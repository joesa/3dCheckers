# Aether Draughts — local coturn configuration
# Install:  sudo apt-get install -y coturn
# Deploy:   sudo cp turn/coturn.conf /etc/turnserver.conf
# Run:      sudo turnserver -c /etc/turnserver.conf -o
# Verify:   ss -lnup | grep 3478

listening-port=3478
listening-ip=0.0.0.0
relay-ip=172.16.0.107

# keep the relay port window small so firewalling/port-forwarding is easy
min-port=49160
max-port=49180

realm=aether.local
lt-cred-mech
user=aether:devturnpass123
fingerprint

# same-machine testing
allow-loopback-peers

# dev box: no certificates
no-tls
no-dtls

no-cli

# --- WAN play (uncomment when the router forwards 3478/tcp+udp and
# --- udp 49160-49180 to 172.16.0.107, and change net.js TURN host to
# --- the public address) ---
# external-ip=99.44.186.23/172.16.0.107
